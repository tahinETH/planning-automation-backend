name: Planning reliability
on:
  pull_request:
  push:
    branches: [main, staging]
permissions:
  contents: read
jobs:
  planning-reliability:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      AUTH_TEST_MODE: 'true'
      DATABASE_PATH: /tmp/planning-reliability-ci.sqlite
      UPLOAD_DIR: /tmp/planning-reliability-ci-uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: All backend regression tests
        run: python -m pytest -q
